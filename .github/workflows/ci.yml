name: EVTY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evty
          POSTGRES_PASSWORD: evty_ci_password
          POSTGRES_DB: evty_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evty -d evty_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
      - name: Apply checked-in database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
      - name: Build API
        run: npm run build
      - name: Run API tests
        run: npm test

  web:
    name: Web lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build


  postgresql:
    name: PostgreSQL schema and migration verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evty
          POSTGRES_PASSWORD: evty_ci_password
          POSTGRES_DB: evty_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evty -d evty_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install
      - name: Validate PostgreSQL Prisma schema
        run: npm run db:pg:validate
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
      - name: Apply PostgreSQL migrations to a fresh database
        run: npm run db:pg:deploy
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
      - name: Generate PostgreSQL Prisma client
        run: npm run db:pg:generate
        env:
          DATABASE_URL: postgresql://evty:evty_ci_password@localhost:5432/evty_ci?schema=public
